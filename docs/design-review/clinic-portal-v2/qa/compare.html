<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doctor Dashboard — five widths side by side</title>
<style>
  body { margin: 0; padding: 24px; background: #E9EEF5; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #0F172A; }
  h1 { margin: 0 0 4px; font-size: 18px; } p { margin: 0 0 16px; font-size: 13px; color: #475467; }
  .row { display: flex; align-items: flex-start; gap: 20px; }
  figure { margin: 0; } figcaption { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  img { display: block; border-radius: 10px; box-shadow: 0 10px 30px -14px rgba(15,23,42,.35); background: #fff; }
</style>
</head>
<body>
<h1>Doctor Dashboard, Option B refined: five exact widths</h1>
<p>Full-page captures at their real width, scaled to the same height here for comparison.</p>
<div class="row">
  <figure><figcaption>1440 · desktop</figcaption><img src="1440-desktop-full.png" style="height:1100px"></figure>
  <figure><figcaption>1024 · laptop</figcaption><img src="1024-laptop-full.png" style="height:1100px"></figure>
  <figure><figcaption>768 · tablet</figcaption><img src="768-tablet-full.png" style="height:1100px"></figure>
  <figure><figcaption>390 · phone</figcaption><img src="390-phone-full.png" style="height:1100px"></figure>
  <figure><figcaption>360 · narrow phone</figcaption><img src="360-narrow-phone-full.png" style="height:1100px"></figure>
</div>
</body>
</html>
