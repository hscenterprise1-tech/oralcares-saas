name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clinic-portal:
    name: Clinic portal tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      # The suite runs on in-memory SQLite (phpunit.xml). The Clinic folder is the part that is green today;
      # widen this to the whole suite once the old, obsolete tests are repaired or removed.
      - name: Clinic portal tests
        run: php artisan test --compact tests/Feature/Clinic tests/Unit

      - name: Build the front end
        run: npm run build
